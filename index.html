<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>古古怪界·记忆翻牌</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #bdefff 0%, #e8ffd9 60%, #c8f7d8 100%);
    min-height: 100vh;
    padding: 16px;
    color: #1f2d3d;
  }
  h1 {
    text-align: center;
    font-size: 28px;
    margin: 8px 0 8px;
  }
  .status {
    text-align: center;
    font-size: 16px;
    margin-bottom: 12px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 480px;
    margin: 0 auto;
  }
  .card {
    aspect-ratio: 1 / 1;
    perspective: 800px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s ease;
    transform-style: preserve-3d;
    border-radius: 14px;
  }
  .card.flipped .inner,
  .card.matched .inner {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    overflow: hidden;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,.12);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back {
    background: linear-gradient(135deg, #5b2bd3, #8b3dff);
    color: #fff;
    font-size: 36px;
    font-weight: 800;
  }
  .front {
    transform: rotateY(180deg);
    background: #fff;
  }
  .front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .controls {
    text-align: center;
    margin-top: 18px;
  }
  button {
    border: none;
    background: #ff7ee0;
    color: #fff;
    font-size: 18px;
    padding: 10px 28px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255,126,224,.35);
  }
  .result {
    text-align: center;
    margin-top: 12px;
    font-size: 16px;
    color: #333;
    min-height: 24px;
  }
</style>
</head>
<body>

<h1>古古怪界·记忆翻牌</h1>
<div class="status">步数：<span id="moves">0</span>　用时：<span id="time">0</span>s</div>

<div class="board" id="board"></div>

<div class="controls">
  <button onclick="init()">重来一局</button>
</div>
<div class="result" id="result"></div>

<script>
const cards = [
  'https://imagetourl.cloud/yaweace8ugh7.jpg',
  'https://imagetourl.cloud/jwxoeyt1ssva.jpg',
  'https://imagetourl.cloud/f7ifdzyzdxeb.jpg',
  'https://imagetourl.cloud/g5qlx1v814jx.jpg',
  'https://imagetourl.cloud/jgu501cca1q2.jpg',
  'https://imagetourl.cloud/65i0raqy3xhb.jpg'
];

const board = document.getElementById('board');
const movesEl = document.getElementById('moves');
const timeEl = document.getElementById('time');
const resultEl = document.getElementById('result');

let flipped = [];
let matchedCount = 0;
let moves = 0;
let timer = null;
let seconds = 0;
let locked = false;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startTimer() {
  if (timer) clearInterval(timer);
  seconds = 0;
  timeEl.textContent = '0';
  timer = setInterval(() => {
    seconds++;
    timeEl.textContent = seconds;
  }, 1000);
}
function stopTimer() {
  if (timer) clearInterval(timer);
}

function init() {
  board.innerHTML = '';
  flipped = [];
  matchedCount = 0;
  moves = 0;
  locked = false;
  movesEl.textContent = '0';
  resultEl.textContent = '';
  stopTimer();

  const pairs = shuffle([...cards, ...cards]);

  pairs.forEach((src) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.src = src;

    card.innerHTML = `
      <div class="inner">
        <div class="face back">？</div>
        <div class="face front">
          <img src="${src}" alt="卡牌" />
        </div>
      </div>
    `;

    card.addEventListener('click', () => flip(card));
    board.appendChild(card);
  });

  startTimer();
}

function flip(card) {
  if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
  card.classList.add('flipped');
  flipped.push(card);

  if (flipped.length === 2) {
    moves++;
    movesEl.textContent = moves;
    checkMatch();
  }
}

function checkMatch() {
  const [a, b] = flipped;
  const same = a.dataset.src === b.dataset.src;

  if (same) {
    setTimeout(() => {
      a.classList.add('matched');
      b.classList.add('matched');
      matchedCount++;
      flipped = [];
      if (matchedCount === cards.length) {
        stopTimer();
        resultEl.textContent = `通关啦！用了 ${moves} 步，${seconds} 秒 ✨（古古怪界胜利）`;
      }
    }, 350);
  } else {
    locked = true;
    setTimeout(() => {
      a.classList.remove('flipped');
      b.classList.remove('flipped');
      flipped = [];
      locked = false;
    }, 700);
  }
}

init();
</script>

</body>
</html>
